name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Analyze, test, build debug and release APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter analyze

      # The live SSH test stays skipped through its tag in dart_test.yaml.
      - run: flutter test

      - run: flutter build apk --debug

      # Release builds are signed with the debug key for now; see
      # android/app/build.gradle.kts.
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v7
        with:
          name: ssh-app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: ssh-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
